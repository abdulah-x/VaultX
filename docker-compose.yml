name: VaultX

services:
  # 1. Database (Starts First)
  postgres:
    image: timescale/timescaledb:2.17.2-pg15
    container_name: VaultX-Database
    environment:
      # Credentials come from the root .env (see .env.example); the :- defaults
      # keep local dev working out of the box but let real deployments override
      # them without editing this file.
      POSTGRES_DB: ${POSTGRES_DB:-crypto_portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-crypto_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto_password}
      POSTGRES_INITDB_ARGS: "-E UTF8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - vaultx_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crypto_user} -d ${POSTGRES_DB:-crypto_portfolio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 1b. Redis (token blacklist + OTP store)
  redis:
    image: redis:7-alpine
    container_name: VaultX-Redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-changeme_dev_redis_password}"]
    ports:
      # Bound to localhost only — Redis holds the JWT blacklist and OTP codes,
      # so it must not be reachable from the LAN/internet.
      - "127.0.0.1:6380:6379"
    networks:
      - vaultx_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_dev_redis_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend (Starts Second, depends on DB)
  backend:
    build:
      context: ./backend
      # The file is named DockerFile (capital F). BuildKit looks for "Dockerfile"
      # and the build context is case-sensitive inside the Linux VM, so without
      # this the backend image fails to build at all.
      dockerfile: DockerFile
    container_name: VaultX-Backend
    ports:
      - "8001:8000"
    environment:
      # DEBUG feeds FastAPI(debug=...), which sends exception detail to clients.
      # Defaults to false so a deployment that forgets to set it is quiet rather
      # than verbose; set DEBUG=true in your .env for local work.
      - DEBUG=${DEBUG:-false}
      # RELOAD=true re-enables uvicorn's autoreloader (see backend/entrypoint.sh).
      # Local development only.
      - RELOAD=${RELOAD:-false}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-crypto_user}:${POSTGRES_PASSWORD:-crypto_password}@postgres:5432/${POSTGRES_DB:-crypto_portfolio}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_dev_redis_password}@redis:6379/0
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3100}
      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # Google Gemini (LLM Portfolio Advisor) - server-side only
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # CREDENTIAL_ENCRYPTION_KEY deliberately NOT listed here — same gotcha as
      # BINANCE_API_KEY below: compose substitutes from the ROOT .env, which
      # doesn't carry it, so listing it would shadow backend/.env with an empty
      # value and make every stored credential unreadable.
      # Allow frontend to access backend
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["http://localhost:3100", "http://127.0.0.1:3100"]}
    volumes:
      - ./backend:/app
      - backend_data:/app/data
      - backup_data:/app/backups
    networks:
      - vaultx_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2a. Price producer (Binance WebSocket -> Redis Streams)
  #
  # Its own service, and deliberately never scaled past one replica. This used to
  # run as a background task inside the API process, which was safe only while
  # the API was a single uvicorn worker: with workers > 1 each worker would open
  # its own Binance subscription and XADD every tick again, so the writer would
  # persist one duplicate row per worker.
  price-ingest:
    build:
      context: ./backend
      # The file is named DockerFile (capital F). BuildKit looks for "Dockerfile"
      # and the build context is case-sensitive inside the Linux VM, so without
      # this the backend image fails to build at all.
      dockerfile: DockerFile
    container_name: VaultX-PriceIngest
    entrypoint: ["python", "-m", "data_pipeline.live_stream"]
    environment:
      - DEBUG=${DEBUG:-false}
      - PYTHONPATH=/app/app
      - DATABASE_URL=postgresql://${POSTGRES_USER:-crypto_user}:${POSTGRES_PASSWORD:-crypto_password}@postgres:5432/${POSTGRES_DB:-crypto_portfolio}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_dev_redis_password}@redis:6379/0
      # BINANCE_* omitted on purpose — see the note on stream-writer below.
    volumes:
      - ./backend:/app
    networks:
      - vaultx_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Neither of these two always-on stream services had a healthcheck or a
    # resource ceiling — a hung-but-alive process wasn't detected/restarted
    # the way postgres/redis/backend are, and nothing bounded memory if a
    # stalled downstream write let messages buffer unboundedly.
    healthcheck:
      # No pgrep/procps in this image -- check PID 1's own cmdline instead,
      # which needs nothing beyond a shell and grep.
      test: ["CMD-SHELL", "grep -q data_pipeline.live_stream /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # 2b. Stream writer (Redis Streams -> TimescaleDB price ingestion)
  stream-writer:
    build:
      context: ./backend
      # The file is named DockerFile (capital F). BuildKit looks for "Dockerfile"
      # and the build context is case-sensitive inside the Linux VM, so without
      # this the backend image fails to build at all.
      dockerfile: DockerFile
    container_name: VaultX-StreamWriter
    # cwd stays /app (matching the backend service) so the mounted backend/.env
    # (at /app/.env) resolves via pydantic-settings' relative env_file path;
    # PYTHONPATH adds /app/app so `data_pipeline`/`core`/`database` resolve as
    # bare imports the same way main.py's sys.path.append does for the API.
    # `entrypoint:` not `command:` — the image defines an ENTRYPOINT
    # (backend/entrypoint.sh, which migrates then starts uvicorn), and a
    # `command:` would be appended to it as arguments rather than replacing it,
    # so this service would silently start a second copy of the API instead of
    # the writer.
    entrypoint: ["python", "-m", "data_pipeline.stream_writer"]
    environment:
      - DEBUG=${DEBUG:-false}
      - PYTHONPATH=/app/app
      - DATABASE_URL=postgresql://${POSTGRES_USER:-crypto_user}:${POSTGRES_PASSWORD:-crypto_password}@postgres:5432/${POSTGRES_DB:-crypto_portfolio}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_dev_redis_password}@redis:6379/0
      # BINANCE_API_KEY/SECRET/TESTNET deliberately NOT listed here — docker-compose
      # substitutes those from the ROOT .env, which doesn't carry them (only
      # backend/.env does; same gotcha documented for GEMINI_API_KEY). Omitting
      # them lets pydantic-settings read the real values straight from the
      # mounted backend/.env instead of an empty override shadowing it.
    volumes:
      - ./backend:/app
    networks:
      - vaultx_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -q data_pipeline.stream_writer /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # 3. Frontend (Starts Last, depends on Backend)
  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* values are INLINED INTO THE BROWSER BUNDLE AT BUILD TIME.
      # The `environment:` block below cannot change them afterwards -- it is kept
      # only so `docker compose config` shows the effective value.
      #
      # That means this URL must be whatever the END USER'S BROWSER can reach,
      # not what the container can reach. It was hardcoded to localhost:8001,
      # which is correct only when the browser runs on the same machine as the
      # stack; deployed anywhere else, every visitor's browser would call its own
      # localhost and the whole app would fail with no server-side trace.
      #
      # Set NEXT_PUBLIC_API_URL in your .env for any non-local deployment, and
      # remember a change requires a REBUILD, not just a restart.
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8001}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    container_name: VaultX-Frontend
    ports:
      - "3100:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8001}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    networks:
      - vaultx_network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
    driver: local
  postgres_data:
    driver: local
  backup_data:
    driver: local

networks:
  vaultx_network:
    driver: bridge
